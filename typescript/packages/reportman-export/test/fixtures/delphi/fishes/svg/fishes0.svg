<text x="523px"  y="37px"  fill="#000000" font-family="Helvetica" font-size="9">1</text>
<text x="45px"  y="37px"  fill="#000000" font-family="Helvetica" font-size="14">Fishes, species</text>
<text x="45px"  y="81px"  fill="#000000" font-family="Helvetica" font-size="16">Category</text>
<text x="172px"  y="81px"  fill="#000000" font-family="Helvetica" font-size="16">Angelfish</text>
<text x="471px"  y="75px"  fill="#000000" font-family="Helvetica" font-size="12">Descriptions and images</text>
<text x="149px"  y="146px"  fill="#000000" font-family="Helvetica" font-size="9">Blue Angelfish</text>
<text x="45px"  y="146px"  fill="#000000" font-family="Helvetica" font-size="9">Name</text>
<text x="419px"  y="146px"  fill="#000000" font-family="Helvetica" font-size="9">Length</text>
<text x="538px"  y="146px"  fill="#000000" font-family="Helvetica" font-size="9">30</text>
<text x="45px"  y="159px"  fill="#000000" font-family="Helvetica" font-size="13">Habitat is around boulders, caves, coral ledges and crevices in shallow waters.  Swims alone or in groups.

Its color changes dramatically from juvenile to adult.  The mature adult fish can startle divers by producing a powerful drumming or thumping sound intended to warn off predators.

Edibility is good.

Range is the entire Indo-Pacific region.</text>
<image x="561px" y="159px" width="135px"  height="45px" xlink:href="fishespage0obj13.jpg"></image>
<text x="112px"  y="360px"  fill="#000000" font-family="Helvetica" font-size="9">1</text>
<text x="45px"  y="404px"  fill="#000000" font-family="Helvetica" font-size="16">Category</text>
<text x="172px"  y="404px"  fill="#000000" font-family="Helvetica" font-size="16">Barracuda</text>
<text x="471px"  y="397px"  fill="#000000" font-family="Helvetica" font-size="12">Descriptions and images</text>
<text x="149px"  y="469px"  fill="#000000" font-family="Helvetica" font-size="9">Great Barracuda</text>
<text x="45px"  y="469px"  fill="#000000" font-family="Helvetica" font-size="9">Name</text>
<text x="419px"  y="469px"  fill="#000000" font-family="Helvetica" font-size="9">Length</text>
<text x="538px"  y="469px"  fill="#000000" font-family="Helvetica" font-size="9">150</text>
<text x="45px"  y="482px"  fill="#000000" font-family="Helvetica" font-size="13">Young barracuda live in inshore seagrass beds, while adults range from inshore channels to the open ocean.  The barracuda feeds on a wide variety of fishes.

It frequently drifts just below the surface and is known to approach divers at very close range.  The long underslung jaw with its very sharp teeth can be disconcerting.  Attacks on humans have reportedly been in cloudy water when the victim is wearing bright diving gear or attempting to spear the fish.

Edibility is good for small specimens, but  large barracuda can carry a fatal toxin.  There is no visible way to tell if the fish is harmful to eat.

Range is worldwide.</text>
